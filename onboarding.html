<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome to Fluter Cash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b1d;--panel:#151832;--line:rgba(255,255,255,.075);--text:#f7f6ff;--muted:#9699b6;--purple:#8b5cf6;--gradient:linear-gradient(115deg,#8559ff 0%,#bd4fe8 52%,#fa4f9d 100%);--shadow:0 24px 65px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 16% -10%,rgba(125,78,255,.18),transparent 34%),radial-gradient(circle at 94% 18%,rgba(244,70,157,.1),transparent 28%),var(--bg);display:flex;justify-content:center}.page{width:100%;max-width:480px;min-height:100vh;padding:25px 20px 40px;display:flex;align-items:center;justify-content:center;position:relative}.skip{position:absolute;right:24px;top:26px;border:0;background:none;color:var(--muted);font-size:13px;padding:10px}.card{width:100%;max-width:440px;min-height:520px;padding:40px 24px 25px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(27,30,61,.96),rgba(21,24,50,.98));box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.logo-tile{width:88px;height:88px;display:grid;place-items:center;margin:0 auto 34px}.brand-mark{width:34px;height:34px;min-width:34px;border-radius:12px;background:var(--gradient);display:grid;place-items:center;box-shadow:0 8px 22px rgba(174,76,236,.3);position:relative;overflow:hidden;transform:scale(2.2)}.brand-mark:before{content:'';width:13px;height:13px;border:2px solid white;border-radius:5px;transform:rotate(45deg)}.brand-mark:after{content:'';position:absolute;width:30px;height:2px;background:rgba(255,255,255,.5);transform:rotate(-45deg)}.card h1{font:800 25px Manrope,sans-serif;letter-spacing:-.8px;margin:0 0 20px}.pill{border-radius:30px;padding:12px 22px;background:var(--gradient);color:white;font-size:14px;font-weight:800;margin-bottom:27px;box-shadow:0 8px 24px rgba(174,76,236,.2)}.desc{max-width:330px;min-height:75px;color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto 30px}.dots{display:flex;gap:12px;align-items:center;margin:0 0 38px}.dots i{width:12px;height:12px;border-radius:20px;background:#343253}.dots i.active{width:42px;background:var(--purple)}.next{width:100%;border:0;border-radius:18px;padding:22px 18px;background:var(--gradient);color:white;font-size:16px;font-weight:800;box-shadow:0 12px 28px rgba(174,76,236,.2)}.next span{margin-left:9px;font-size:20px}@media(max-height:680px){.card{min-height:0;padding:28px 22px}.logo-tile{margin-bottom:20px}.desc{margin-bottom:18px}.dots{margin-bottom:22px}}
</style>
</head>
<body><main class="page"><button class="skip" onclick="finish()">× Skip</button><section class="card"><div class="logo-tile" aria-label="Fluter Cash logo"><span class="brand-mark"></span></div><h1 id="title">Welcome to Fluter Cash! 🎉</h1><div class="pill" id="pill">₦170,000 Welcome Bonus</div><p class="desc" id="desc">Your account is set up and ready to go. Your welcome reward is shown in your preview wallet.</p><div class="dots" id="dots"></div><button class="next" id="next" onclick="advance()">Next <span>→</span></button></section></main>
<script>
const slides=[
{title:'Welcome to Fluter Cash! 🎉',pill:'₦170,000 Welcome Bonus',desc:'Your account is set up and ready to go. Your welcome reward is shown in your preview wallet.'},
{title:'Start Earning Today 💰',pill:'Daily Tasks Available',desc:'Complete simple tasks daily to earn rewards. The more you do, the more preview credits you can collect.'},
{title:'Invite & Earn More 🤝',pill:'Referral Bonus',desc:'Share your referral code with friends. Referral rewards can be enabled when the live rewards programme launches.'},
{title:'Withdraw Anytime 🏦',pill:'Withdrawal Options',desc:'Review the withdrawal experience and add your payout details. Real bank withdrawals are not enabled yet.'},
{title:"You're All Set! 🚀",pill:"Let's Go",desc:'Everything is ready. Tap below to explore your Fluter Cash dashboard and get started.'}
];let index=0;
function render(){const x=slides[index];document.getElementById('title').textContent=x.title;document.getElementById('pill').textContent=x.pill;document.getElementById('desc').textContent=x.desc;document.getElementById('dots').innerHTML=slides.map((_,i)=>'<i class="'+(i===index?'active':'')+'"></i>').join('');document.getElementById('next').innerHTML=index===4?'Get Started <span>→</span>':'Next <span>→</span>'}
function advance(){if(index<4){index++;render()}else finish()}
function finish(){localStorage.setItem('fluterOnboardingDone','1');window.location.href='./index.html'}
render();
</script></body></html>
